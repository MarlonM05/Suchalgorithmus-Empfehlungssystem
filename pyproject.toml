[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender"
version = "0.1.0"
description = "Recommendation system for search algorithms (DHBW Ravensburg, Theoretische Informatik)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "numba>=0.60", "pandas>=2.2", "scikit-learn>=1.5", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recommender = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
